[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-agesci-campania-coreui-theme"
version = "0.2.0a1"
description = "Tema CoreUI 5 per applicazioni Django dell'AGESCI Campania: si appoggia a django-agesci-campania-theme (template tag, palette) e aggiunge il layout nativo CoreUI (sidebar + header) e i componenti free di CoreUI."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "AGESCI Campania" }]
keywords = ["django", "coreui", "bootstrap", "agesci", "theme", "scout"]
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 6.0",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
]
dependencies = [
    # template tag (agesci_tags, agesci_components), context processor, immagini
    # e palette vengono dal tema base. Template dei componenti, form renderer,
    # override allauth, JS e SCSS dei partial sono copie proprie (markup BS5).
    # >=3.0.0a1: i tag ag_feature_grid / ag_masonry_grid passano "cols", usato dalle copie CoreUI dei template.
    "django-agesci-campania-theme>=3.0.0a1",
]

[project.optional-dependencies]
allauth = ["django-agesci-campania-theme[allauth]"]

[project.urls]
Homepage = "https://github.com/AGESCI-Campania/django-agesci-campania-theme"
Repository = "https://github.com/AGESCI-Campania/django-agesci-campania-theme"

[tool.uv.sources]
django-agesci-campania-theme = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["agesci_coreui"]

[tool.hatch.build.targets.sdist]
include = [
    "/agesci_coreui",
    "/README.md",
    "/LICENSE",
]
