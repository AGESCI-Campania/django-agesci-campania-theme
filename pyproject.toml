[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-agesci-campania-theme"
version = "2.2.1"
description = "Tema Bootstrap 5 per applicazioni Django dell'AGESCI Campania, con palette ufficiale e personalizzazione per branca."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "AGESCI Campania" }]
keywords = ["django", "bootstrap", "agesci", "theme", "scout"]
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 6.0",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
]
dependencies = [
    "Django>=6.0",
]

[project.optional-dependencies]
# Supporto icone Bootstrap Icons tramite django-bootstrap-icons.
# Installazione: uv add "django-agesci-campania-theme[icons]"
# Aggiungere "bootstrap_icons" a INSTALLED_APPS e impostare BS_ICONS_CACHE
# per le prestazioni (vedi README).
icons = ["django-bootstrap-icons>=0.9"]

[project.urls]
Homepage = "https://github.com/AGESCI-Campania/django-agesci-campania-theme"
Repository = "https://github.com/AGESCI-Campania/django-agesci-campania-theme"

[dependency-groups]
dev = [
    "Django>=6.0",
    "django-bootstrap-icons>=0.9",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["agesci_theme"]

[tool.hatch.build.targets.sdist]
include = [
    "/agesci_theme",
    "/README.md",
    "/LICENSE",
]
