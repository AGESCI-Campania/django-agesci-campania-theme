name: publish

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dipendenze
        run: uv sync

      - name: Django system check
        run: |
          uv run python example_project/manage.py check
          uv run python example_project/manage.py check --settings=config.settings_coreui

      # Monorepo con due pacchetti PyPI: il prefisso del tag della release
      # decide quale pubblicare.
      #   vX.Y.Z         -> django-agesci-campania-theme (Bootstrap)
      #   coreui-vX.Y.Z  -> django-agesci-campania-coreui-theme (CoreUI)
      - name: Build package
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          case "$TAG" in
            coreui-v*) uv build --package django-agesci-campania-coreui-theme ;;
            v*)        uv build --package django-agesci-campania-theme ;;
            *) echo "Tag '$TAG' non riconosciuto: usa vX.Y.Z o coreui-vX.Y.Z"; exit 1 ;;
          esac

      - name: Carica artefatti
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # necessario per il Trusted Publishing OIDC

    steps:
      - name: Scarica artefatti
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Pubblica su PyPI
        run: uv publish --trusted-publishing automatic

  build-docs-pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # necessario per caricare asset nella release

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installa dipendenze documentazione
        run: pip install -r docs/requirements.txt

      - name: Genera PDF documentazione
        run: sphinx-build -b rinoh docs/ docs/_build/pdf/

      - name: Carica PDF nella release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            "docs/_build/pdf/django-agesci-campania-theme.pdf" \
            --clobber
