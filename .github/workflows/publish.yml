name: publish

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dipendenze
        run: uv sync

      - name: Django system check
        run: uv run python example_project/manage.py check

      - name: Build package
        run: uv build

      - name: Carica artefatti
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # necessario per il Trusted Publishing OIDC

    steps:
      - name: Scarica artefatti
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Pubblica su PyPI
        run: uv publish --trusted-publishing automatic
