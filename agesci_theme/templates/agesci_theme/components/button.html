{% if href %}
<a href="{{ href }}"
   class="btn-{% if outline %}outline{% else %}solid{% endif %} theme-{{ theme }}{% if size %} btn-{{ size }}{% endif %}">
  {{ label }}
</a>
{% else %}
<button type="{{ type }}"
        class="btn-{% if outline %}outline{% else %}solid{% endif %} theme-{{ theme }}{% if size %} btn-{{ size }}{% endif %}">
  {{ label }}
</button>
{% endif %}
