{% comment %}variant="link": bottone testuale (btn btn-link); Bootstrap 6 non ha theme-link.{% endcomment %}
{% if href %}
<a href="{{ href }}"
   class="{% if variant == 'link' %}btn btn-link{% else %}btn-{% if outline %}outline{% else %}solid{% endif %} theme-{{ theme }}{% endif %}{% if size %} btn-{{ size }}{% endif %}">
  {{ label }}
</a>
{% else %}
<button type="{{ type }}"
        class="{% if variant == 'link' %}btn btn-link{% else %}btn-{% if outline %}outline{% else %}solid{% endif %} theme-{{ theme }}{% endif %}{% if size %} btn-{{ size }}{% endif %}">
  {{ label }}
</button>
{% endif %}
