<div class="mb-3">
  {% if label %}
    <label for="{{ id }}" class="form-label">{{ label }}{% if required %} *{% endif %}</label>
  {% endif %}
  <div class="input-group">
    <input type="password"
           name="{{ name }}"
           id="{{ id }}"
           class="form-control{% if errors %} is-invalid{% endif %}"
           {% if value %}value="{{ value }}"{% endif %}
           {% if placeholder %}placeholder="{{ placeholder }}"{% endif %}
           {% if autocomplete %}autocomplete="{{ autocomplete }}"{% endif %}
           {% if required %}required{% endif %}>
    {% include "agesci_theme/components/_password_toggle_button.html" %}
  </div>
  {% if errors %}
    <div class="invalid-feedback">
      {% for error in errors %}{{ error }}{% if not forloop.last %}<br>{% endif %}{% endfor %}
    </div>
  {% endif %}
  {% if help_text %}<span class="helptext">{{ help_text|safe }}</span>{% endif %}
</div>
