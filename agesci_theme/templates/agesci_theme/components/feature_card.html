<div class="col">
  <div class="d-flex gap-5">
    {% if icon %}
    <div class="ag-feature-icon flex-shrink-0{% if variant %} {{ variant }}{% endif %}">
      <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
        <use href="#{{ icon }}"/>
      </svg>
    </div>
    {% endif %}
    <div>
      {% if title %}<h3 class="fs-lg fw-bold">{{ title }}</h3>{% endif %}
      {% if description %}<p class="fg-2 mb-0">{{ description }}</p>{% endif %}
    </div>
  </div>
</div>
