<div class="ag-jumbotron{% if variant %} ag-jumbotron--{{ variant }}{% endif %} mb-7">
  {% if title %}<h1 class="fs-4xl fw-bold">{{ title }}</h1>{% endif %}
  {% if lead %}<p class="md:col-8 fs-xl fw-light">{{ lead }}</p>{% endif %}
  {% if cta_text %}
  <hr class="my-7">
  <a href="{{ cta_url }}" class="btn-solid theme-primary btn-lg">{{ cta_text }}</a>
  {% endif %}
</div>
