{# Combobox modificabile Bootstrap 6 (InputChip / CampoChip): il JS disegna i chip dalle voci .selected del .menu #}
{# e crea un <input type="hidden" name=...> per ogni chip. is-invalid va sull'input (Bootstrap colora il contenitore con :has()). #}
<div class="combobox combobox-control theme-primary" data-bs-toggle="combobox" data-bs-name="{{ widget.name }}" data-bs-multiple="true" data-bs-allow-custom="true" data-bs-separator="," data-bs-create-on-blur="true"{% if widget.max_chip %} data-bs-max-items="{{ widget.max_chip }}"{% endif %}>
  <input type="text" class="form-ghost combobox-input{% if widget.invalido %} is-invalid{% endif %}"{% if widget.attrs.id %} id="{{ widget.attrs.id }}"{% endif %}{% if widget.placeholder %} placeholder="{{ widget.placeholder }}"{% endif %} autocomplete="off"{% for nome, valore in widget.attrs.items %}{% if nome == "aria-describedby" or nome == "aria-invalid" %} {{ nome }}="{{ valore }}"{% endif %}{% endfor %}{% if widget.attrs.disabled %} disabled{% endif %}>
</div>
<div class="menu ag-chip-menu">
  {% for valore in widget.value %}
    <button class="menu-item selected" type="button" data-bs-value="{{ valore }}">{{ valore }}</button>
  {% endfor %}
</div>
