{% if breadcrumb_items %}
<nav aria-label="percorso" class="breadcrumb-agesci">
  <ol class="breadcrumb mb-0 py-3 px-5">
    {% for item in breadcrumb_items %}
      {% if forloop.last %}
        <li class="breadcrumb-item" aria-current="page"><span class="breadcrumb-link active">{{ item.label }}</span></li>
      {% else %}
        <li class="breadcrumb-item"><a class="breadcrumb-link" href="{{ item.url }}">{{ item.label }}</a></li>
        <li class="breadcrumb-divider"></li>
      {% endif %}
    {% endfor %}
  </ol>
</nav>
{% endif %}
