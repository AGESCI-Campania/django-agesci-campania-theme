{% load static %}
<footer class="footer-agesci mt-5">
  <div class="container">
    <div class="row align-items-center gy-3">
      <div class="col-md-3 text-center text-md-start">
        <img src="{% static agesci_theme_logo_navbar %}" alt="{{ agesci_theme_nome }}" class="footer-emblema">
      </div>
      <div class="col-md-6 text-center small">
        {% block footer_text %}
        <strong>{{ agesci_theme_nome }}</strong><br>
        Associazione Guide e Scouts Cattolici Italiani
        {% endblock %}
      </div>
      <div class="col-md-3 text-center text-md-end small">
        {% block footer_links %}
        <a href="https://www.agesci.it" target="_blank" rel="noopener">agesci.it</a>
        {% endblock %}
      </div>
    </div>
  </div>
</footer>
